services:
  - type: web
    name: pine-labs-talent-intelligence
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./pine_labs_talent.db
      - key: UPLOAD_DIR
        value: ../../storage
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: Pine Labs Talent Intelligence
      - key: SMTP_USE_TLS
        value: "true"
